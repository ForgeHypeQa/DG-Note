<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qalm · ForgeHype</title>
<meta name="theme-color" content="#161414">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qalm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..850&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="listen.css">
</head>
<body>
<div class="app t-dark login" id="loginScreen"></div>
<div class="app t-dark" id="app" hidden>
  <header class="hdr">
    <div class="hrow">
      <img class="qlogo" src="/icons/qalm-logo.png" alt="Qalm by ForgeHype" width="118" height="46">
      <button class="me" data-act="account" aria-label="Account">··</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="solo" class="on">Solo</button>
      <button role="tab" data-tab="listen">Listen</button>
      <button role="tab" data-tab="group">Group</button>
      <button role="tab" data-tab="reports">Recap<span class="tbadge" id="repBadge"></span></button>
    </nav>
  </header>
  <div id="lisPlayer" hidden></div>
  <main id="view"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="bsheet" id="bsheet" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="fileIn" accept="audio/*,video/*" hidden>
<input type="file" id="tplFileIn" accept=".pdf,.txt,.md,application/pdf,text/plain" hidden>

<script src="app.js"></script>
</body>
</html>
